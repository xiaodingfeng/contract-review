name: zhongan-contract-review-poc

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./deploy/poc.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ./deploy/poc.env
    environment:
      PORT: "3000"
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DB_POOL_MIN: "0"
      DB_POOL_MAX: "10"
      VECTOR_STORE: postgres
      REVIEW_KB_ONLY_MODE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_generated_files:/app/public/files
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - app

  onlyoffice:
    image: onlyoffice/documentserver:9.3.1.2
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: "${ONLYOFFICE_JWT_SECRET:?ONLYOFFICE_JWT_SECRET must be set in deploy/poc.env}"
      JWT_HEADER: Authorization
      JWT_IN_BODY: "true"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "false"
      USE_UNAUTHORIZED_STORAGE: "false"
      EXAMPLE_ENABLED: "false"
      NGINX_ACCESS_LOG: "false"
    ports:
      - "127.0.0.1:${ONLYOFFICE_PORT:-8081}:80"
    shm_size: "1gb"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_lib:/var/lib/onlyoffice
      - onlyoffice_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      - app

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_APP_BACKEND_API_URL: ""
        VITE_APP_ONLYOFFICE_URL: "${ONLYOFFICE_PUBLIC_URL:?ONLYOFFICE_PUBLIC_URL must be set in deploy/poc.env}"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      onlyoffice:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./deploy/.htpasswd:/etc/nginx/.htpasswd:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
  backend_uploads:
  backend_generated_files:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_lib:
  onlyoffice_db:
