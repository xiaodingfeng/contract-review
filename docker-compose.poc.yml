name: zhongan-contract-review-poc

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./deploy/poc.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ./deploy/poc.env
    environment:
      PORT: "3000"
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DB_POOL_MIN: "0"
      DB_POOL_MAX: "10"
      VECTOR_STORE: postgres
      REVIEW_KB_ONLY_MODE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_generated_files:/app/public/files
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - app

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_APP_BACKEND_API_URL: ""
        VITE_APP_ONLYOFFICE_URL: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./deploy/.htpasswd:/etc/nginx/.htpasswd:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
  backend_uploads:
  backend_generated_files:
